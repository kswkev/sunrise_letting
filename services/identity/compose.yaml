# Local runs only: spring-boot:run starts this through Spring Boot Docker Compose support.
# Tests use Testcontainers, and in the cluster the datasource comes from environment variables.
services:
  postgres:
    image: postgres:17.6
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: local-dev-only
    # A random host port, so it doesn't clash with anything else on the machine.
    ports:
      - "5432"
