spring:
  application:
    name: identity
  # The datasource comes from compose.yaml on local runs. In the cluster, set the environment
  # variables SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME and SPRING_DATASOURCE_PASSWORD.
  mvc:
    log-request-details: false

# web runs on 8080 on a developer's machine, so identity needs a different port there.
server:
  port: 8081

# Request bodies carry passwords. These loggers can print them at debug level, so they stay
# at INFO even if a wider package such as org.springframework.web is turned up for debugging.
logging:
  level:
    org.springframework.web.filter.CommonsRequestLoggingFilter: INFO
    org.springframework.web.servlet.mvc.method.annotation: INFO
    org.springframework.http.converter: INFO
