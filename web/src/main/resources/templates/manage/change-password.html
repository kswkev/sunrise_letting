<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main/content()}, ~{::script}, 'manage')}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${hasErrors} ? 'Error: Change your password - Sunrise Letting' : 'Change your password - Sunrise Letting'">Change your password - Sunrise Letting</title>
    <script src="/js/password-toggle.js" defer></script>
</head>
<body>
<main>
    <div class="form-column">
        <th:block th:if="${!summaryErrors.isEmpty()}"><div th:replace="~{fragments/form :: errorSummaryList(${summaryErrors})}"></div></th:block>
        <th:block th:if="${unavailable}"><div th:replace="~{fragments/form :: errorSummaryForm(message=#{change-password.error.unavailable})}"></div></th:block>
        <h1>Change your password</h1>
        <p>You're signed in with a temporary password. Choose a new password to continue.</p>
        <form id="change-password-form" method="post" th:action="@{/manage/change-password}" novalidate>
            <div th:replace="~{fragments/form :: password(id='new-password', name='newPassword', label='New password', suffix='new password', hint=#{change-password.new-password.hint}, error=${fieldErrors['newPassword']}, autocomplete='new-password')}"></div>
            <div th:replace="~{fragments/form :: password(id='confirm-new-password', name='confirmNewPassword', label='Confirm new password', suffix='confirm new password', error=${fieldErrors['confirmNewPassword']}, autocomplete='new-password')}"></div>
            <button type="submit" class="button">Change password</button>
        </form>
    </div>
</main>
</body>
</html>
