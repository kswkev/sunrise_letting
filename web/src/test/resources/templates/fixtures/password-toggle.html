<!DOCTYPE html>
<html th:replace="~{layout :: layout(~{::title}, ~{::main/content()}, ~{::script}, '')}" xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Password toggle fixture - Sunrise Letting</title>
    <script src="/js/password-toggle.js" defer></script>
</head>
<body>
<main>
    <form th:action="@{/fixtures/password-toggle/validate}" method="post" novalidate>
        <div th:replace="~{fragments/form :: password(id='secret', name='secret', label='Secret', suffix='secret', autocomplete='new-password', hxPost='/fixtures/password-toggle/validate', hxParams='secret,_csrf')}"></div>
        <div th:replace="~{fragments/form :: password(id='confirm-secret', name='confirmSecret', label='Confirm secret', suffix='confirm secret', autocomplete='new-password')}"></div>
        <button id="fixture-submit" type="submit" class="button">Submit</button>
    </form>
</main>
</body>
</html>
